<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryoAxis – THULIR Process Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">CryoAxis</span>
    <span class="brand-sub">THULIR Process Monitor</span>
  </div>
  <div class="topbar-logos">
    <span class="logo-chip"><img src="{{ url_for('static', filename='img/thulir_logo.png') }}" alt="THULIR – REC-Chennai"></span>
    <span class="logo-chip"><img src="/bg_image/rec_logo.png" alt="Rajalakshmi Engineering College"></span>
  </div>
  <div class="topbar-right">
    <div class="conn" title="Hardware telemetry connection">
      <span id="connDot" class="dot off"></span><span id="connLabel">NO DEVICE</span>
    </div>
    <div class="clock"><div class="d" id="clockDate"></div><div class="t" id="clockTime"></div></div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="nav"></nav>
  <main class="main">
    <div id="view"></div>
    <footer class="footer">
      <div class="slogan">Built with science, driven by conservation, and made for those who protect what grows.</div>
      <div class="team">– iGEM Team REC-CHENNAI ❤️</div>
    </footer>
  </main>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
